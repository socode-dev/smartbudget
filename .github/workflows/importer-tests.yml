name: Importer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  importer-tests:
    name: Firestore Emulator Importer Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run importer tests
        env:
          SFTP_IMPORT_HMAC_SECRET: test-only-smartbudget-import-secret
          NODE_ENV: test
        run: npm run test:importer
