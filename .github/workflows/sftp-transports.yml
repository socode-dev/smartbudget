name: SFTP Daily Transport

on:
    schedule:
        - cron: "0 5 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: smartbudget-sftp-schedulers
    cancel-in-progress: false

jobs:
    process-incoming-files:
        name: Process incoming SFTP files
        environment: production
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Process incoming files
              env:
                NODE_ENV: production
                FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
                FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
                FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
                SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
                SFTP_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SFTP_PRIVATE_KEY_PASSPHRASE }}
                SFTP_IMPORT_HMAC_SECRET: ${{ secrets.SFTP_IMORT_HMAC_SECRET }}
                SFTP_DELIVERY_SPOOL_ENCRYPTION_KEY: ${{ secrets.SFTP_DELIVERY_SPOOL_ENCRYPTION_KEY }}
                SMARTBUDGET_ACTIVATION_BASE_URL: ${{ vars.SMARTBUDGET_ACTIVATION_BASE_URL }}
              run: npm run sftp:run-transport