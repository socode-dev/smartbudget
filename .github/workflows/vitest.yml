name: Vitest Tests

on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

jobs:
    test:
        name: Run Vitest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npx vitest run