name: Vitest Tests

on:
    workflow_call:

jobs:
    test:
        name: Run Vitest
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Run Tests
              run: npx vitest run